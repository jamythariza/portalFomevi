<div class="container py-4">
    <div class="row p-5">
        <div>
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h2 class="text-2xl font-bold">Certificado de afiliación FOMEVI</h2>
            </div>
        </div>
        <form [formGroup]="formReport">
            <div class="row mb-4">
                <div class="form-group col-3">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" class="form-control" id="name" formControlName="ciudad" />
                    <div *ngIf="formReport.get('ciudad')?.invalid && formReport.get('ciudad')?.touched">
                        <span class="text-danger" *ngIf="formReport.get('ciudad')?.errors?.['required']">El campo es
                            obligatorio.</span>
                    </div>
                </div>
                <div class="form-group col-3">
                    <label for="email">dirigido a</label>
                    <input type="text" class="form-control" id="dirigido" formControlName="dirigido" />
                    <div *ngIf="formReport.get('dirigido')?.invalid && formReport.get('dirigido')?.touched">
                        <span class="text-danger" *ngIf="formReport.get('dirigido')?.errors?.['required']">El campo es
                            obligatorio.</span>
                    </div>
                </div>
                <div class="form-group col-3 m-4">
                    <!-- checkbox para seleccionar motivo -->
                    <mat-checkbox formControlName="intTipo">Mostrar saldo de ahorro</mat-checkbox>
                </div>
                <div class="form-group col-3">
                    <button class="btn btn-primary btn-sm text-white" (click)="generateReport()">
                        Generar Reporte
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
