<owl-carousel-o [options]="customOptions">
  <ng-container *ngFor="let line of credits">
    <ng-template carouselSlide (id)="slide.id">
      <a (click)="onDetail(line.guid ?? '');">
        <img [src]="line.image">
        <p class="title-lines">{{line.description}}</p>
        <div class="text-center ">
          <a (click)="onDetail(line.guid ?? '');" class="btn btn-lg button from-left">Conoce más</a>
        </div>
      </a>
    </ng-template>
  </ng-container>
</owl-carousel-o>
