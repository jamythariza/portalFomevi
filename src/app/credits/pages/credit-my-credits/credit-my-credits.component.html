<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
            <div class="card px-3 pt-4 pb-3 mt-3 mb-3">

                <div class="d-flex justify-content-between align-items-center">
                    <h2 id="heading" class="mb-0">Mis solicitudes de Crédito</h2>

                    <button class="btn btn-primary btn-sm text-white" (click)="createCredit()">
                        Solicitar crédito
                    </button>
                </div>

            </div>
            <div class="table-container" *ngIf="credits.length > 0">
                <table id="nestedTable">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Nombre</th>
                            <th>Línea</th>
                            <th>Fecha Sol.</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let credit of credits">
                            <td>{{ credit.code }}</td>
                            <td>{{ credit.nameComplete }}</td>
                            <td>{{ credit.creditlineDescription }}</td>
                            <td>{{ credit.dateCreate | date:'dd-MM-yyyy'}}</td>
                            <td><span class="badge-status" [ngClass]="getBadgeClass(credit.stateDescription)">{{
                                    credit.stateDescription
                                    }}</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
