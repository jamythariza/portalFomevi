<section id="Novedades" class="content-reveal">
  <div class="title_content title-content">
    <h2>Te puede interesar</h2>
    <p class="subTitle">Conoce las novedades que tenemos para ti.</p>
  </div>
  <div class="row justify-content-center">
    <div class="col-xs-6 col-sm-6 col-md-3 col-lg-2 p-2" *ngFor="let new of news">
      <figure class="snip1529 snip1">
        <img src="{{ new.imageBase64 }}" alt="pr-sample13" />
        <div class="date">
          <span class="day">{{ new.dayFormat }}</span><span class="month">{{ new.monthFormat.substring(0,3) }}</span>
        </div>
        <figcaption>
          <h3>{{ new.name }}</h3>
        </figcaption>

        <div class="hover"><i class="ion-android-open"></i></div>
        <a routerLink="/detail/{{ new.guid }}"></a>
      </figure>
    </div>
  </div>
</section>
