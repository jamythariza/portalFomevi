<header>
  <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div *ngFor="let banner of banners; let i = index" class="carousel-item" [ngClass]="{ active: i === 0 }">
        <a routerLink=""></a>
        <a (click)="goToLink(banner.urlSite)" target="_blank" [ngClass]="banner.urlSite == null ? 'not-link' : ''">
          <img src="{{ banner.imageBase64 }}" class="d-block w-100" alt="banner fomevi" />
        </a>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</header>
